name: Update README Cards

on:
  schedule:
    - cron: "0 3 * * *"   # chạy mỗi ngày lúc 03:00 UTC (~10:00 sáng giờ VN)
  workflow_dispatch:        # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=midnight-purple&hide_border=true&bg_color=0a0a0f&title_color=a78bfa&icon_color=38bdf8&text_color=9d8cb0&ring_color=a78bfa
          path: dist/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=midnight-purple&hide_border=true&layout=compact&langs_count=8&bg_color=0a0a0f&title_color=a78bfa&text_color=9d8cb0
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0a0a0f&color=a78bfa&line=7c3aed&point=38bdf8&area_color=1e1a2e&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
